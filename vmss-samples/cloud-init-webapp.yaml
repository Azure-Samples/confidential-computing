#cloud-config
# Bootstraps a tiny CPU-bound web app on each Confidential VM in the scale set.
# Uses only the Python 3 standard library that ships in the Ubuntu CVM image, so the
# app still comes up when the subnet has no outbound internet access (-NoInternetAccess).
write_files:
  - path: /opt/ccdemo/app.py
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env python3
      """Minimal CPU-burn web app used to demonstrate VMSS autoscale on Confidential VMs."""
      import hashlib
      import json
      import os
      import socket
      import subprocess
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      PORT = 8080
      HOSTNAME = socket.gethostname()
      STARTED = time.time()
      SERVED = 0

      def detect_isolation():
          # systemd reports the confidential VM technology and works unprivileged. The /dev/sev-guest
          # and /dev/tdx_guest device nodes are NOT present on the Azure Ubuntu CVM image, so they are
          # only a fallback for other distributions.
          try:
              result = subprocess.run(['systemd-detect-virt', '--cvm'],
                                      capture_output=True, text=True, timeout=5)
              flavour = result.stdout.strip()
              if flavour and flavour != 'none':
                  return {'sev-snp': 'AMD SEV-SNP', 'sev-es': 'AMD SEV-ES', 'sev': 'AMD SEV',
                          'tdx': 'Intel TDX'}.get(flavour, flavour)
          except Exception:
              pass
          if os.path.exists('/dev/sev-guest'):
              return 'AMD SEV-SNP'
          if os.path.exists('/dev/tdx_guest'):
              return 'Intel TDX'
          return 'none detected (not a Confidential VM guest)'

      # Detected once at startup so a burst of requests does not spawn a process per request.
      ISOLATION = detect_isolation()

      def burn(seconds):
          """Hash a 4KB buffer in a loop. hashlib releases the GIL for buffers this size,
          so concurrent requests spread across vCPUs and move the VMSS 'Percentage CPU' metric."""
          deadline = time.time() + seconds
          block = os.urandom(4096)
          rounds = 0
          while time.time() < deadline:
              for _ in range(500):
                  hashlib.sha256(block).digest()
              rounds += 500
          return rounds

      PAGE = """<!doctype html>
      <html><head><title>Confidential VMSS demo</title>
      <style>body{{font-family:system-ui,sans-serif;margin:3em auto;max-width:40em;line-height:1.5}}
      code{{background:#eee;padding:.15em .4em;border-radius:3px}}</style></head>
      <body><h1>Confidential VMSS demo</h1>
      <p>Served by instance <strong>{host}</strong></p>
      <ul>
        <li>Isolation: <code>{iso}</code></li>
        <li>vCPUs: <code>{cpus}</code></li>
        <li>Uptime: <code>{up}s</code></li>
        <li>Requests served by this instance: <code>{served}</code></li>
      </ul>
      <p>Generate load with <code>/burn?seconds=20</code>, or run <code>Start-VmssLoad.ps1</code>.</p>
      </body></html>"""

      class Handler(BaseHTTPRequestHandler):
          protocol_version = 'HTTP/1.1'

          def _send(self, code, body, ctype):
              payload = body.encode('utf-8')
              self.send_response(code)
              self.send_header('Content-Type', ctype)
              self.send_header('Content-Length', str(len(payload)))
              self.send_header('X-Instance', HOSTNAME)
              self.end_headers()
              self.wfile.write(payload)

          def do_GET(self):
              global SERVED
              SERVED += 1
              parsed = urlparse(self.path)
              query = parse_qs(parsed.query)

              if parsed.path == '/health':
                  self._send(200, 'ok', 'text/plain')
              elif parsed.path == '/burn':
                  try:
                      seconds = float(query.get('seconds', ['10'])[0])
                  except ValueError:
                      seconds = 10.0
                  seconds = max(0.1, min(seconds, 120.0))
                  started = time.time()
                  rounds = burn(seconds)
                  self._send(200, json.dumps({
                      'host': HOSTNAME,
                      'isolation': ISOLATION,
                      'requested_seconds': seconds,
                      'elapsed_seconds': round(time.time() - started, 3),
                      'hash_rounds': rounds,
                  }), 'application/json')
              elif parsed.path == '/info':
                  self._send(200, json.dumps({
                      'host': HOSTNAME,
                      'isolation': ISOLATION,
                      'cpus': os.cpu_count(),
                      'uptime_seconds': int(time.time() - STARTED),
                      'served': SERVED,
                  }), 'application/json')
              else:
                  self._send(200, PAGE.format(
                      host=HOSTNAME,
                      iso=ISOLATION,
                      cpus=os.cpu_count(),
                      up=int(time.time() - STARTED),
                      served=SERVED,
                  ), 'text/html')

          def log_message(self, fmt, *args):
              pass

      if __name__ == '__main__':
          ThreadingHTTPServer(('0.0.0.0', PORT), Handler).serve_forever()

  - path: /etc/systemd/system/ccdemo.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Confidential VMSS demo web app
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/ccdemo/app.py
      Restart=always
      RestartSec=2
      DynamicUser=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, ccdemo.service ]
