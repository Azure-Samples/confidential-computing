# Experimental generic driver: availability is not proof of Azure-FDE support.
driver:
  version: "615.71.09"
  kernelModuleType: open
daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: sku
      operator: Equal
      value: gpu
      effect: NoSchedule
node-feature-discovery:
  worker:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: sku
        operator: Equal
        value: gpu
        effect: NoSchedule
