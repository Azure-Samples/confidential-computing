apiVersion: batch/v1
kind: Job
metadata:
  name: confidential-gpu-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        agentpool: gpunp
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector-add
          image: nvcr.io/nvidia/gpu-operator:v26.7.2
          command: [sh, -c, "nvidia-smi && vectorAdd"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
              nvidia.com/gpu: 1
