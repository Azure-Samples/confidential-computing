apiVersion: v1
kind: Pod
metadata:
  name: signed-driver-load
spec:
  restartPolicy: Never
  nodeSelector:
    agentpool: gpunp
  tolerations:
    - key: sku
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: probe
      image: ubuntu:24.04
      command: [bash, -c, "sleep 14400"]
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 4Gi
      volumeMounts:
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: firmware
          mountPath: /lib/firmware
        - name: devices
          mountPath: /dev
        - name: driver
          mountPath: /run/nvidia/driver
        - name: sysfirmware
          mountPath: /sys/firmware
          readOnly: true
        - name: security
          mountPath: /sys/kernel/security
          readOnly: true
  volumes:
    - name: modules
      hostPath:
        path: /lib/modules
        type: Directory
    - name: firmware
      hostPath:
        path: /lib/firmware
        type: Directory
    - name: devices
      hostPath:
        path: /dev
        type: Directory
    - name: driver
      hostPath:
        path: /run/nvidia/driver
        type: DirectoryOrCreate
    - name: sysfirmware
      hostPath:
        path: /sys/firmware
        type: Directory
    - name: security
      hostPath:
        path: /sys/kernel/security
        type: Directory
